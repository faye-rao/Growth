[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-engine"
version = "0.1.0"
description = "Botim Growth Platform - M2 Cohort Segmentation Rule Engine (MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "faye-rao" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.0", "fastapi>=0.110", "httpx>=0.27", "pyroaring>=0.4"]
api = ["fastapi>=0.110", "uvicorn>=0.23"]
bitmap = ["pyroaring>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
